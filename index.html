
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch The Box Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <h1>🎮 CATCH THE BOX</h1>
        <p class="subtitle">Tangkap kotaknya sebanyak mungkin!</p>

        <div class="score-board">
            <div class="score">
                <p>SKOR</p>
                <h2 id="score">0</h2>
            </div>

            <div class="score">
                <p>WAKTU</p>
                <h2 id="time">30</h2>
            </div>

            <div class="score">
                <p>REKOR</p>
                <h2 id="highScore">0</h2>
            </div>
        </div>

        <div class="game-area" id="gameArea">

            <div class="message" id="message">
                <h2>Siap Bermain?</h2>
                <p>Klik tombol mulai untuk bermain!</p>
                <button id="startBtn">MULAI GAME</button>
            </div>

            <button id="target" class="target">🎯</button>

        </div>

        <p class="instruction">
            💡 Klik target secepat mungkin sebelum waktu habis!
        </p>

        <button id="restartBtn" class="restart-btn">
            🔄 Main Lagi
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
