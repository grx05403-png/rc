<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matkul & Dosen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <aside class="sidebar">
        <h1>📚 AbsenKelas</h1>
        <nav>
            <a href="index.html">📋 Absensi</a>
            <a href="matkul.html" class="active">⚙️ Matkul & Dosen</a>
            <a href="rekap.html">📊 Rekap</a>
        </nav>
        <div class="sidebar-footer">© 2025 AbsenKelas</div>
    </aside>

    <main class="main">
        <header class="page-header">
            <h2>Kelola Matkul & Dosen</h2>
            <p>Tambahkan mata kuliah beserta dosen pengampu</p>
        </header>

        <!-- Form Tambah -->
        <div class="card">
            <h3>➕ Tambah Matkul</h3>
            <form onsubmit="return tambahMatkul(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Kode Matkul</label>
                        <input type="text" placeholder="IF101" required>
                    </div>
                    <div class="form-group">
                        <label>Nama Matkul</label>
                        <input type="text" placeholder="Pemrograman Web" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Dosen Pengampu</label>
                    <select required>
                        <option value="">-- Pilih Dosen --</option>
                        <option>Dr. Budi Santoso, M.Kom</option>
                        <option>Siti Aminah, S.T., M.T.</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Simpan Matkul</button>
            </form>
        </div>

        <!-- Tabel Daftar Matkul -->
        <div class="card">
            <h3>📚 Daftar Matkul</h3>
            <table>
                <thead>
                    <tr><th>Kode</th><th>Mata Kuliah</th><th>Dosen</th><th>Aksi</th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td>IF101</td>
                        <td>Pemrograman Web</td>
                        <td>Dr. Budi Santoso, M.Kom</td>
                        <td><button class="btn-danger" onclick="hapus(this)">Hapus</button></td>
                    </tr>
                    <tr>
                        <td>IF102</td>
                        <td>Basis Data</td>
                        <td>Siti Aminah, S.T., M.T.</td>
                        <td><button class="btn-danger" onclick="hapus(this)">Hapus</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
function tambahMatkul(e) {
    e.preventDefault();
    alert("✅ Matkul berhasil ditambahkan! (tampilan prototipe)");
}
function hapus(btn) {
    if (confirm("Yakin ingin menghapus matkul ini?")) {
        btn.closest("tr").remove();
    }
}
</script>
</body>
</html>
